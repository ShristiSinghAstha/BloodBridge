<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blood Request Dispatch – BloodBridge Admin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- Global Navigation -->
    <header id="bb-navbar"></header>

    <!-- Dashboard Layout -->
    <div class="bb-dashboard-layout">
      <aside id="bb-sidebar"></aside>

      <main class="bb-main-content">
        <!-- Header -->
        <div class="bb-flex bb-justify-between bb-items-center" style="margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 class="bb-heading-1">Blood Request Dispatch &amp; Live Tracking</h1>
            <p class="bb-text-muted bb-mt-sm">
              Real-time monitoring of urgent patient transfusion requests, geographic donor matching, and fulfillment.
            </p>
          </div>
          <button id="refresh-requests-btn" class="bb-btn bb-btn-secondary bb-btn-sm">
            🔄 Refresh Requests
          </button>
        </div>

        <!-- Filter & Search Controls -->
        <div class="bb-card" style="padding: 1.25rem 1.5rem; margin-bottom: 2rem;">
          <div class="bb-grid bb-grid-4" style="gap: 1rem;">
            <div class="bb-form-group" style="margin-bottom: 0;">
              <label class="bb-label" for="request-search">Search Requests</label>
              <input
                id="request-search"
                type="text"
                class="bb-input"
                placeholder="Search patient, hospital, notes…"
              />
            </div>

            <div class="bb-form-group" style="margin-bottom: 0;">
              <label class="bb-label" for="filter-blood-group">Blood Group</label>
              <select id="filter-blood-group" class="bb-select">
                <option value="all">All Blood Groups</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>

            <div class="bb-form-group" style="margin-bottom: 0;">
              <label class="bb-label" for="filter-urgency">Urgency Level</label>
              <select id="filter-urgency" class="bb-select">
                <option value="all">All Urgency Levels</option>
                <option value="critical">Critical (Hours)</option>
                <option value="high">High (&lt; 24h)</option>
                <option value="medium">Medium (&lt; 3 days)</option>
                <option value="low">Low (&lt; 1 week)</option>
              </select>
            </div>

            <div class="bb-form-group" style="margin-bottom: 0;">
              <label class="bb-label" for="filter-status">Request Status</label>
              <select id="filter-status" class="bb-select">
                <option value="all">All Statuses</option>
                <option value="open">Open</option>
                <option value="matching">Matching in Progress</option>
                <option value="awaiting_response">Awaiting Donor Response</option>
                <option value="donor_accepted">Donor Accepted</option>
                <option value="fulfilled">Fulfilled</option>
                <option value="cancelled">Cancelled</option>
                <option value="expired">Expired</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Loading Spinner -->
        <div id="requests-loading" class="bb-flex bb-justify-center bb-items-center" style="min-height: 250px;">
          <div class="bb-spinner"></div>
        </div>

        <!-- Content Container -->
        <div id="requests-content" class="bb-card" style="padding: 0; display: none;">
          <div id="requests-empty" class="bb-empty-state" style="display: none;">
            <div class="bb-empty-state-icon">🩸</div>
            <p>No blood requests match your current filters.</p>
          </div>

          <div id="requests-table-container" class="bb-table-wrapper" style="border-radius: 0; border: none; display: none;">
            <table class="bb-table">
              <thead>
                <tr>
                  <th>Request / Blood</th>
                  <th>Patient Requester</th>
                  <th>Hospital &amp; City</th>
                  <th>Units</th>
                  <th>Urgency</th>
                  <th>Status</th>
                  <th>Required By</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="requests-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- Request Details & Matching Donors Modal -->
        <div id="request-modal" class="bb-modal-overlay" style="display: none;">
          <div class="bb-modal" style="max-width: 760px;">
            <button id="modal-close-btn" class="bb-modal-close" aria-label="Close">&times;</button>
            <div id="modal-body">
              <div class="bb-flex bb-justify-center" style="padding: 3rem;">
                <div class="bb-spinner"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="../js/pages/admin-requests.js"></script>
  </body>
</html>
