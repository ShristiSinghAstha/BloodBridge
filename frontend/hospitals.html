<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partner Hospitals – BloodBridge</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="bb-navbar"></header>

    <main class="bb-section">
      <div class="bb-container">
        <div class="bb-flex bb-justify-between bb-items-center" style="margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 class="bb-heading-1">Partner Hospitals</h1>
            <p class="bb-text-muted bb-mt-xs">
              Verified hospitals and transfusion centers connected to BloodBridge.
            </p>
          </div>
          <div style="width: 100%; max-width: 360px;">
            <input
              id="hospital-search"
              type="text"
              class="bb-input"
              placeholder="Search by hospital name or city…"
            />
          </div>
        </div>

        <div id="hospitals-loading" class="bb-flex bb-justify-center" style="padding: 4rem;">
          <div class="bb-spinner"></div>
        </div>

        <div id="hospitals-container" class="bb-grid bb-grid-3" style="display: none;"></div>

        <div id="hospitals-empty" class="bb-empty-state" style="display: none;">
          <div class="bb-empty-state-icon">🏥</div>
          <p>No hospitals found matching your search.</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer style="border-top: 1px solid rgba(255,255,255,0.06); padding: 3rem 1.5rem 2rem; color: var(--bb-grey-500); font-size: 0.875rem;">
      <div class="bb-container" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem;">
        <div class="bb-nav-logo" style="text-decoration: none;">
          <span class="logo-dot"></span>
          <span style="color: var(--bb-white); font-weight: 700; font-size: 1.1rem;">Blood<span class="bb-text-gradient">Bridge</span></span>
        </div>
        <div class="bb-flex bb-gap-md" style="flex-wrap: wrap;">
          <a href="index.html" class="bb-nav-link" style="color: var(--bb-grey-400);">Home</a>
          <a href="hospitals.html" class="bb-nav-link" style="color: var(--bb-grey-400);">Hospitals</a>
          <a href="about.html" class="bb-nav-link" style="color: var(--bb-grey-400);">About</a>
          <a href="login.html" class="bb-nav-link" style="color: var(--bb-grey-400);">Sign In</a>
          <a href="register.html" class="bb-nav-link" style="color: var(--bb-grey-400);">Register</a>
        </div>
      </div>
      <div style="text-align: center; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 1.5rem;">
        © 2026 BloodBridge. Partner hospitals network. All rights reserved.
      </div>
    </footer>

    <script type="module" src="js/pages/hospitals.js"></script>
  </body>
</html>
